<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Kingdom Builder (Mobile)</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFC107">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SKB Mobile">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="stylesheet" href="styles.css">
    
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <header class="app-header">
        <div class="logo">
            <span class="logo-title">SUPER Modular Kingdom Builder</span>
            <span class="logo-version">v0.1 Mobile</span>
        </div>
        <button class="menu-btn" aria-label="Menu">☰</button>
    </header>

    <main class="app-content">
        <div id="render-container"></div>
    </main>

    <nav class="app-bottom-nav">
        <div class="toolbar-top">
            <div id="selected-object-label">เลือกวัตถุเพื่อสร้าง</div>
        </div>
        <div class="object-selector" id="object-selector-container">
            </div>
        <div class="main-actions">
            <button class="nav-item active" data-action="build" aria-label="Build Mode">
                <span class="icon">🏗️</span>
                <span class="label">สร้าง</span>
            </button>
            <button class="nav-item" data-action="play" aria-label="Play Mode">
                <span class="icon">🕹️</span>
                <span class="label">เล่น</span>
            </button>
            <button class="nav-item" data-action="clear" aria-label="Clear City">
                <span class="icon">🗑️</span>
                <span class="label">ล้าง</span>
            </button>
        </div>
    </nav>

    <script type="module" src="app.js"></script>
</body>
</html>
