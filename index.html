<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent 3D Builder Studio</title>

  <!-- PWA & Mobile Web App Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="3D Builder">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      flex-direction: row;
      height: 100vh;
      background-color: #1a1a1a;
      color: #ffffff;
      overflow: hidden;
    }
    #sidebar {
      width: 400px;
      min-width: 330px;
      padding: 18px;
      background: #242424;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-right: 1px solid #333333;
      z-index: 10;
      overflow-y: auto;
    }
    h1 {
      font-size: 1.25rem;
      color: #00d2ff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    label {
      font-size: 13px;
      color: #cccccc;
      margin-bottom: -4px;
    }
    input[type="password"],
    input[type="text"],
    input[type="file"],
    textarea {
      width: 100%;
      padding: 9px 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #181818;
      color: #fff;
      font-size: 13.5px;
      line-height: 1.5;
    }
    input[type="file"] {
      padding: 7px;
      cursor: pointer;
    }
    textarea {
      height: 75px;
      resize: vertical;
    }
    button {
      padding: 10px 14px;
      border-radius: 6px;
      border: none;
      background: #0084ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 13.5px;
    }
    button:hover:not(:disabled) {
      background: #0070d6;
    }
    button:disabled {
      background: #555555;
      cursor: not-allowed;
    }
    #export-glb-btn {
      background: #28a745;
    }
    #export-glb-btn:hover:not(:disabled) {
      background: #218838;
    }
    #app-status {
      padding: 9px 12px;
      border-radius: 4px;
      font-size: 12.5px;
      background: #333333;
      color: #bbbbbb;
      word-break: break-word;
    }
    #app-status[data-status="ready"] {
      background: #14381e;
      color: #4ade80;
    }
    #app-status[data-status="generating"] {
      background: #3e3312;
      color: #facc15;
    }
    #app-status[data-status="error"] {
      background: #441717;
      color: #f87171;
    }
    #download-link,
    #download-image-btn {
      display: inline-block;
      text-align: center;
      padding: 10px;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
    }
    #download-link {
      background: #10b981;
    }
    #download-link:hover {
      background: #059669;
    }
    #download-image-btn {
      background: #4f46e5;
    }
    #download-image-btn:hover {
      background: #4338ca;
    }
    #canvas-container {
      flex: 1;
      height: 100%;
      position: relative;
      min-height: 250px;
      background-color: #111111;
    }
    #preview-container,
    #uploaded-preview-container {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: #1e1e1e;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
    }
    #preview-image,
    #uploaded-image-preview {
      width: 100%;
      height: auto;
      max-height: 140px;
      object-fit: contain;
      background: #141414;
      border-radius: 4px;
      border: 1px solid #444;
    }
    #detected-palette {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .color-dot {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid #666;
    }
    #remove-image-btn {
      background: #dc2626;
      padding: 5px 8px;
      font-size: 12px;
    }
    #remove-image-btn:hover {
      background: #b91c1c;
    }

    /* Outliner and Inspector */
    #outliner-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #1b1b1b;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      max-height: 160px;
      overflow-y: auto;
    }
    .outliner-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 8px;
      background: #282828;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .outliner-item.selected {
      background: #005bb5;
      border: 1px solid #00d2ff;
    }
    .outliner-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .outliner-controls input[type="color"] {
      width: 22px;
      height: 22px;
      border: none;
      padding: 0;
      background: none;
      cursor: pointer;
    }

    /* Viewport Floating Controls */
    #viewport-controls {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 20;
      display: flex;
      gap: 8px;
    }
    .tool-btn {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #555;
      color: #fff;
      backdrop-filter: blur(4px);
    }
    .tool-btn.active {
      background: #0084ff;
      border-color: #00d2ff;
    }
    #touch-toggle-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 20;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #555;
      color: #fff;
      backdrop-filter: blur(4px);
    }
    #touch-toggle-btn.locked {
      background: rgba(220, 38, 38, 0.8);
      border-color: #ef4444;
    }

    /* Responsive Mobile Mode */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #canvas-container {
        height: 42vh;
        min-height: 260px;
        width: 100%;
        flex: none;
      }
      #sidebar {
        width: 100%;
        min-width: unset;
        height: auto;
        flex: none;
        overflow-y: visible;
        border-right: none;
        border-top: 1px solid #333333;
        padding: 16px;
        padding-bottom: 40px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container">
    <div id="viewport-controls">
      <button class="tool-btn active" id="btn-translate" type="button"> Move (W)</button>
      <button class="tool-btn" id="btn-rotate" type="button"> Rotate (E)</button>
      <button class="tool-btn" id="btn-scale" type="button"> Scale (R)</button>
      <button class="tool-btn" id="btn-motion" type="button"> Motion: ON</button>
    </div>
    <button id="touch-toggle-btn" type="button">  3D ()</button>
  </div>

  <div id="sidebar">
    <h1>Agent 3D Studio</h1>
    
    <label for="api-key-input">Gemini API Key:</label>
    <input 
      type="password" 
      id="api-key-input" 
      data-testid="api-key-input" 
      placeholder=" Gemini API Key " />

    <label for="image-input"> 2D:</label>
    <input 
      type="file" 
      id="image-input" 
      data-testid="image-input" 
      accept="image/*" />

    <div id="uploaded-preview-container">
      <img id="uploaded-image-preview" alt="Uploaded Preview" />
      <div id="detected-palette"></div>
      <button id="remove-image-btn" type="button"> </button>
    </div>

    <label for="prompt-input">:</label>
    <textarea 
      id="prompt-input" 
      data-testid="prompt-input" 
      placeholder=":  Pin BFDI   "></textarea>

    <button id="generate-btn" data-testid="generate-btn">Generate 3D</button>
    <button id="export-glb-btn" data-testid="export-glb-btn" disabled>Export GLB</button>
    
    <div id="app-status" data-testid="app-status" data-status="idle">Status: Idle</div>

    <label> (Scene Outliner):</label>
    <div id="outliner-panel">
      <div style="font-size: 12px; color: #888;"></div>
    </div>
    
    <a id="download-link" data-testid="download-link" style="display: none;" download="model.glb">
      Download Model (.glb)
    </a>

    <div id="preview-container">
      <label> (Snapshot Image):</label>
      <img id="preview-image" data-testid="preview-image" alt="3D Model Preview" />
      <a id="download-image-btn" data-testid="download-image-btn" download="model-preview.png">
        Download Image (.png)
      </a>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';

    // 1.  Service Worker  PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('SW registered:', reg.scope))
          .catch((err) => console.error('SW failed:', err));
      });
    }

    // 2.  Three.js Scene, Camera, WebGLRenderer
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(4, 4, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // TransformControls 
    const transformControls = new TransformControls(camera, renderer.domElement);
    transformControls.size = 0.75;
    scene.add(transformControls);

    transformControls.addEventListener('dragging-changed', (e) => {
      controls.enabled = !e.value;
    });

    // Toon Gradient Texture 3  Cel-shading
    const colors = new Uint8Array([80, 175, 255]);
    const format = renderer.capabilities.isWebGL2 ? THREE.RedFormat : THREE.LuminanceFormat;
    const toonGradient = new THREE.DataTexture(colors, 3, 1, format);
    toonGradient.minFilter = THREE.NearestFilter;
    toonGradient.magFilter = THREE.NearestFilter;
    toonGradient.needsUpdate = true;

    // : Ambient, Hemisphere, Key Light  Front Fill Light
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x333333, 0.5);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(8, 14, 8);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
    fillLight.position.set(-5, 4, 8);
    scene.add(fillLight);

    const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
    scene.add(gridHelper);

    const modelGroup = new THREE.Group();
    scene.add(modelGroup);

    // 3.  Viewport
    let isTouchLocked = false;
    let isMotionActive = true;
    let selectedMesh = null;
    const clock = new THREE.Clock();

    const touchToggleBtn = document.getElementById('touch-toggle-btn');
    touchToggleBtn.addEventListener('click', () => {
      isTouchLocked = !isTouchLocked;
      controls.enabled = !isTouchLocked;
      touchToggleBtn.classList.toggle('locked', isTouchLocked);
      touchToggleBtn.textContent = isTouchLocked ? '  ()' : '  3D ()';
    });

    const btnTranslate = document.getElementById('btn-translate');
    const btnRotate = document.getElementById('btn-rotate');
    const btnScale = document.getElementById('btn-scale');
    const btnMotion = document.getElementById('btn-motion');

    function setGizmoMode(mode, activeBtn) {
      transformControls.setMode(mode);
      [btnTranslate, btnRotate, btnScale].forEach(b => b.classList.remove('active'));
      activeBtn.classList.add('active');
    }

    btnTranslate.addEventListener('click', () => setGizmoMode('translate', btnTranslate));
    btnRotate.addEventListener('click', () => setGizmoMode('rotate', btnRotate));
    btnScale.addEventListener('click', () => setGizmoMode('scale', btnScale));

    btnMotion.addEventListener('click', () => {
      isMotionActive = !isMotionActive;
      btnMotion.textContent = isMotionActive ? ' Motion: ON' : ' Motion: OFF';
      btnMotion.classList.toggle('active', isMotionActive);
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'w' || e.key === 'W') setGizmoMode('translate', btnTranslate);
      if (e.key === 'e' || e.key === 'E') setGizmoMode('rotate', btnRotate);
      if (e.key === 'r' || e.key === 'R') setGizmoMode('scale', btnScale);
    });

    // 4. Raycaster  Canvas
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    renderer.domElement.addEventListener('pointerdown', (e) => {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(modelGroup.children, true);
      const valid = intersects.find(hit => hit.object.userData && hit.object.userData.isSelectable);

      if (valid) {
        selectObject(valid.object);
      }
    });

    function selectObject(mesh) {
      selectedMesh = mesh;
      transformControls.attach(mesh);
      document.querySelectorAll('.outliner-item').forEach(item => {
        item.classList.toggle('selected', item.dataset.id === mesh.userData.id);
      });
    }

    function updateViewport() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (w > 0 && h > 0) {
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      }
    }
    window.addEventListener('resize', updateViewport);

    // 5. Main Render Loop  Procedural Idle & Breathing Motion
    function animate() {
      requestAnimationFrame(animate);
      if (controls.enabled) controls.update();

      const time = clock.getElapsedTime();
      if (isMotionActive) {
        modelGroup.children.forEach(root => {
          if (!root.userData.isOutline) {
            root.position.y = (root.userData.baseY || 0) + Math.sin(time * 3) * 0.035;
          }
          root.traverse(child => {
            if (child.userData && child.userData.id) {
              const id = child.userData.id.toLowerCase();
              if (id.includes('head')) {
                child.rotation.y = (child.userData.baseRotY || 0) + Math.sin(time * 2) * 0.05;
              } else if (id.includes('arm')) {
                child.rotation.z = (child.userData.baseRotZ || 0) + Math.sin(time * 2.8) * 0.06;
              }
            }
          });
        });
      }

      renderer.render(scene, camera);
    }
    animate();

    function disposeHierarchy(obj) {
      if (obj.children) {
        while (obj.children.length > 0) {
          disposeHierarchy(obj.children[0]);
          obj.remove(obj.children[0]);
        }
      }
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
        else obj.material.dispose();
      }
    }

    function fitCameraToObject(object) {
      const box = new THREE.Box3().setFromObject(object);
      if (box.isEmpty()) return;
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const fov = camera.fov * (Math.PI / 180);
      let dist = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 2.2;

      camera.position.set(center.x + dist * 0.75, center.y + dist * 0.65, center.z + dist * 0.95);
      camera.lookAt(center);
      controls.target.copy(center);
      controls.update();
    }

    // 6.  3D  Chunky Vinyl Figure  Bevel  Inverted Hull
    function renderModel(spec) {
      transformControls.detach();
      selectedMesh = null;

      while (modelGroup.children.length > 0) {
        const obj = modelGroup.children[0];
        disposeHierarchy(obj);
        modelGroup.remove(obj);
      }

      const outlinerPanel = document.getElementById('outliner-panel');
      outlinerPanel.innerHTML = '';

      if (!spec.objects || !Array.isArray(spec.objects)) return;

      const objectMap = new Map();

      spec.objects.forEach((item, index) => {
        let geometry;
        const p = item.parameters || {};

        if (item.type === 'box') {
          geometry = new THREE.BoxGeometry(p.width || 1, p.height || 1, p.depth || 1);
        } else if (item.type === 'cylinder') {
          geometry = new THREE.CylinderGeometry(
            p.radiusTop !== undefined ? p.radiusTop : 0.5,
            p.radiusBottom !== undefined ? p.radiusBottom : 0.5,
            p.height || 1,
            p.radialSegments || 32
          );
        } else if (item.type === 'sphere') {
          geometry = new THREE.SphereGeometry(p.radius || 0.5, p.widthSegments || 32, p.heightSegments || 16);
        } else if (item.type === 'cone') {
          geometry = new THREE.ConeGeometry(p.radius || 0.5, p.height || 1, p.radialSegments || 32);
        } else if (item.type === 'torus') {
          geometry = new THREE.TorusGeometry(p.radius || 0.5, p.tube || 0.2, p.radialSegments || 16, p.tubularSegments || 32);
        } else if (item.type === 'capsule') {
          geometry = new THREE.CapsuleGeometry(p.radius || 0.5, p.length || 1, p.capSubdivisions || 8, p.radialSegments || 16);
        } else if (item.type === 'lathe') {
          const raw = (p.points && Array.isArray(p.points) && p.points.length > 1) ? p.points : [[0, 0], [0.5, 0.5], [0.3, 1], [0, 1]];
          const pts = raw.map(pt => new THREE.Vector2(Math.max(0, pt[0]), pt[1]));
          geometry = new THREE.LatheGeometry(pts, p.segments || 32);
        } else if (item.type === 'extrude') {
          const shape = new THREE.Shape();
          const pts = (p.shape && Array.isArray(p.shape) && p.shape.length >= 3) ? p.shape : [[0, 0], [1, 0], [0.5, 1]];
          shape.moveTo(pts[0][0], pts[0][1]);
          for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i][0], pts[i][1]);
          shape.closePath();

          //  0.6  (Rounded Bevel) 
          const extrudeSettings = {
            depth: p.depth !== undefined ? p.depth : 0.6,
            bevelEnabled: p.bevelEnabled !== undefined ? p.bevelEnabled : true,
            bevelSegments: p.bevelSegments !== undefined ? p.bevelSegments : 3,
            steps: 1,
            bevelSize: p.bevelSize !== undefined ? p.bevelSize : 0.05,
            bevelThickness: p.bevelThickness !== undefined ? p.bevelThickness : 0.06
          };
          geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        } else if (item.type === 'tube') {
          const raw = (p.path && Array.isArray(p.path) && p.path.length > 1)
            ? p.path.map(pt => new THREE.Vector3(...pt))
            : [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 1, 0)];
          const curve = new THREE.CatmullRomCurve3(raw);
          geometry = new THREE.TubeGeometry(curve, p.tubularSegments || 20, p.radius || 0.04, p.radialSegments || 8, false);
        } else if (item.type === 'plane') {
          geometry = new THREE.PlaneGeometry(p.width || 1, p.height || 1);
        }

        if (geometry) {
          const material = new THREE.MeshToonMaterial({
            color: item.color || '#e0e0e0',
            gradientMap: toonGradient,
            side: item.type === 'plane' ? THREE.DoubleSide : THREE.FrontSide
          });

          const mesh = new THREE.Mesh(geometry, material);
          if (item.position) mesh.position.set(...item.position);
          if (item.rotation) mesh.rotation.set(...item.rotation);
          if (item.scale) mesh.scale.set(...item.scale);
          
          mesh.castShadow = true;
          mesh.receiveShadow = true;

          const id = item.id || `piece_${index}`;
          mesh.userData = {
            id: id,
            isSelectable: true,
            baseY: mesh.position.y,
            baseRotY: mesh.rotation.y,
            baseRotZ: mesh.rotation.z
          };
          objectMap.set(id, mesh);

          //  Inverted Hull 
          if (item.type !== 'plane') {
            const outlineMat = new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide });
            const outlineMesh = new THREE.Mesh(geometry, outlineMat);
            outlineMesh.scale.multiplyScalar(1.035);
            outlineMesh.userData = { isOutline: true };
            mesh.add(outlineMesh);
          }

          if (item.parent && objectMap.has(item.parent)) {
            objectMap.get(item.parent).add(mesh);
          } else {
            modelGroup.add(mesh);
          }

          const outlinerRow = document.createElement('div');
          outlinerRow.className = 'outliner-item';
          outlinerRow.dataset.id = id;
          outlinerRow.innerHTML = `
            <span>${id} (${item.type})</span>
            <div class="outliner-controls">
              <input type="color" value="${item.color || '#cccccc'}">
            </div>
          `;

          outlinerRow.addEventListener('click', (e) => {
            if (e.target.tagName !== 'INPUT') selectObject(mesh);
          });

          outlinerRow.querySelector('input[type="color"]').addEventListener('input', (e) => {
            material.color.set(e.target.value);
          });

          outlinerPanel.appendChild(outlinerRow);
        }
      });

      fitCameraToObject(modelGroup);
      renderer.render(scene, camera);

      const dataUrl = renderer.domElement.toDataURL('image/png');
      const previewContainer = document.getElementById('preview-container');
      const previewImg = document.getElementById('preview-image');
      const downloadImgBtn = document.getElementById('download-image-btn');

      previewImg.src = dataUrl;
      downloadImgBtn.href = dataUrl;
      previewContainer.style.display = 'flex';
    }

    // 7. Client-Side Color & Palette Analyzer
    const imageInput = document.getElementById('image-input');
    const uploadedPreviewContainer = document.getElementById('uploaded-preview-container');
    const uploadedImagePreview = document.getElementById('uploaded-image-preview');
    const detectedPaletteContainer = document.getElementById('detected-palette');
    const removeImageBtn = document.getElementById('remove-image-btn');

    let currentImageBase64 = null;
    let currentImageMimeType = null;
    let detectedColorsSummary = '';

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const result = event.target.result;
        uploadedImagePreview.src = result;
        uploadedPreviewContainer.style.display = 'flex';

        const match = result.match(/^data:(image\/[a-zA-Z+]+);base64,(.+)$/);
        if (match) {
          currentImageMimeType = match[1];
          currentImageBase64 = match[2];
        }

        const img = new Image();
        img.onload = () => {
          const cvs = document.createElement('canvas');
          const ctx = cvs.getContext('2d');
          cvs.width = 64;
          cvs.height = 64;
          ctx.drawImage(img, 0, 0, 64, 64);
          const data = ctx.getImageData(0, 0, 64, 64).data;
          const colorCounts = {};

          for (let i = 0; i < data.length; i += 16) {
            const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
            if (a < 80) continue;
            const qr = Math.round(r / 24) * 24;
            const qg = Math.round(g / 24) * 24;
            const qb = Math.round(b / 24) * 24;
            const hex = '#' + ((1 << 24) + (qr << 16) + (qg << 8) + qb).toString(16).slice(1);
            colorCounts[hex] = (colorCounts[hex] || 0) + 1;
          }

          const topColors = Object.entries(colorCounts)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 4)
            .map(c => c[0]);

          detectedPaletteContainer.innerHTML = '<span style="font-size:12px;color:#aaa;">:</span>';
          topColors.forEach(hex => {
            const dot = document.createElement('div');
            dot.className = 'color-dot';
            dot.style.backgroundColor = hex;
            dot.title = hex;
            detectedPaletteContainer.appendChild(dot);
          });
          detectedColorsSummary = topColors.join(', ');
        };
        img.src = result;
      };
      reader.readAsDataURL(file);
    });

    removeImageBtn.addEventListener('click', () => {
      imageInput.value = '';
      currentImageBase64 = null;
      currentImageMimeType = null;
      detectedColorsSummary = '';
      uploadedPreviewContainer.style.display = 'none';
      uploadedImagePreview.src = '';
    });

    // 8.  Gemini 3.5 Flash-Lite API
    const apiKeyInput = document.getElementById('api-key-input');
    const promptInput = document.getElementById('prompt-input');
    const generateBtn = document.getElementById('generate-btn');
    const exportBtn = document.getElementById('export-glb-btn');
    const appStatus = document.getElementById('app-status');
    const downloadLink = document.getElementById('download-link');

    const savedApiKey = localStorage.getItem('gemini_api_key');
    if (savedApiKey) apiKeyInput.value = savedApiKey;
    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
    });

    function setStatus(state, msg) {
      appStatus.setAttribute('data-status', state);
      appStatus.textContent = `Status: ${msg}`;
    }

    const SYSTEM_PROMPT = `
You are a master 3D stylized procedural toy modeler. Convert the user's reference image and prompt into a CHUNKY 3D VINYL FIGURE (collectible toy style with depth and rounded edges).
NEVER create paper-thin flat cutouts! Output ONLY a valid JSON object matching this schema:
{
  "objects": [
    {
      "id": "unique_id",
      "parent": "parent_id_or_null",
      "type": "box" | "cylinder" | "sphere" | "cone" | "torus" | "capsule" | "lathe" | "extrude" | "tube" | "plane",
      "parameters": {
        // box: "width": float, "height": float, "depth": float
        // cylinder: "radiusTop": float, "radiusBottom": float, "height": float, "radialSegments": int
        // sphere: "radius": float, "widthSegments": int, "heightSegments": int
        // cone: "radius": float, "height": float, "radialSegments": int
        // torus: "radius": float, "tube": float, "radialSegments": int, "tubularSegments": int
        // capsule: "radius": float, "length": float
        // lathe: "points": [[x, y], ...], "segments": int
        // extrude: "shape": [[x, y], ...], "depth": float, "bevelEnabled": bool, "bevelThickness": float, "bevelSize": float
        // tube: "path": [[x, y, z], ...], "radius": float, "tubularSegments": int
        // plane: "width": float, "height": float
      },
      "position": [x, y, z],
      "rotation": [rotX, rotY, rotZ],
      "scale": [scaleX, scaleY, scaleZ],
      "color": "#hexcode"
    }
  ]
}

STRICT CHUNKY 3D TOY MODELING RULES:
1. SOLID CHUNKY DEPTH (NO PAPER-THIN PLATES):
   - When modeling 2D cartoon characters (e.g. Pin, Leafy from BFDI), turn them into thick 3D vinyl collectible figurines.
   - Use "extrude" for the main body silhouette with substantial depth: depth: 0.5 to 0.75, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.05. This gives the body a tactile, rounded 3D toy feel.
   - For Pin (pushpin):
     * Body: Red hourglass/flared head shape via extrude with depth: 0.6 (position: [0, 0.4, 0]).
     * Top Spike: Silver 3D metal tip with full 3D thickness (cone with radius: 0.22, height: 0.8, or extrude pyramid with depth: 0.6) placed at the top center.
2. STICK LIMBS WITH CHUNKY TOY FEEL:
   - Arms and legs: Use cylinders or tubes with radius 0.035 to 0.05 (color: "#000000").
   - Legs emerge from the bottom underside (-Y) and have tiny rounded foot pads.
   - Arms emerge from the sides with natural bends.
3. 2D FACIAL FEATURES ON 3D CHUNKY SURFACE:
   - Eyes and mouth must be placed slightly forward on the front face (Z offset ~ depth + bevelThickness + 0.02) so they don't clip into the body.
   - Use small black spheres/capsules (color: "#000000") for eyes and mouth.
4. FOR 3D VOLUMETRIC CHARACTERS (Mario, Yoshi):
   - Build complete head, snout, body, shoes, and props with 35 to 65 primitives as previously described.
`;

    generateBtn.addEventListener('click', async () => {
      const apiKey = apiKeyInput.value.trim();
      const prompt = promptInput.value.trim();

      if (!apiKey) {
        setStatus('error', ' Gemini API Key ');
        return;
      }
      if (!prompt && !currentImageBase64) {
        setStatus('error', ' 3D  2D');
        return;
      }

      setStatus('generating', 'Connecting to Gemini API...');
      generateBtn.disabled = true;
      exportBtn.disabled = true;
      downloadLink.style.display = 'none';

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`;

      const parts = [];
      if (currentImageBase64) {
        parts.push({
          inline_data: {
            mime_type: currentImageMimeType || 'image/jpeg',
            data: currentImageBase64
          }
        });
      }

      let userText = prompt || ' 3D  (Chunky Vinyl Toy)   ';
      if (detectedColorsSummary) {
        userText += ` (Detected Dominant Colors: ${detectedColorsSummary})`;
      }
      parts.push({ text: userText });

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: parts }],
            systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
            generationConfig: {
              responseMimeType: "application/json",
              temperature: 0.1
            }
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!rawText) throw new Error('');

        const specData = JSON.parse(rawText);
        renderModel(specData);
        
        setStatus('ready', ' 3D ');
        exportBtn.disabled = false;
      } catch (err) {
        setStatus('error', ': ' + err.message);
      } finally {
        generateBtn.disabled = false;
      }
    });

    exportBtn.addEventListener('click', () => {
      setStatus('generating', ' GLB...');
      const exporter = new GLTFExporter();
      exporter.parse(
        modelGroup,
        (glb) => {
          const blob = new Blob([glb], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(blob);
          downloadLink.href = url;
          downloadLink.style.display = 'block';
          setStatus('ready', 'Export ! ');
        },
        (error) => setStatus('error', 'Export error: ' + error.message),
        { binary: true }
      );
    });

    setTimeout(updateViewport, 100);
  </script>
</body>
