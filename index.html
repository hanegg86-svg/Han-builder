<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent 3D Builder</title>

  <!-- PWA & Mobile Web App Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="3D Builder">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      flex-direction: row;
      height: 100vh;
      background-color: #1a1a1a;
      color: #ffffff;
      overflow: hidden;
    }
    #sidebar {
      width: 380px;
      min-width: 320px;
      padding: 20px;
      background: #242424;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-right: 1px solid #333333;
      z-index: 10;
      overflow-y: auto;
    }
    h1 {
      font-size: 1.2rem;
      color: #00d2ff;
    }
    label {
      font-size: 13px;
      color: #cccccc;
      margin-bottom: -6px;
    }
    input[type="password"],
    input[type="text"],
    input[type="file"],
    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #181818;
      color: #fff;
      font-size: 14px;
      line-height: 1.5;
    }
    input[type="file"] {
      padding: 8px;
      cursor: pointer;
    }
    textarea {
      height: 85px;
      resize: vertical;
    }
    button {
      padding: 12px 16px;
      border-radius: 6px;
      border: none;
      background: #0084ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 14px;
    }
    button:hover:not(:disabled) {
      background: #0070d6;
    }
    button:disabled {
      background: #555555;
      cursor: not-allowed;
    }
    #export-glb-btn {
      background: #28a745;
    }
    #export-glb-btn:hover:not(:disabled) {
      background: #218838;
    }
    #app-status {
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 13px;
      background: #333333;
      color: #bbbbbb;
      word-break: break-word;
    }
    #app-status[data-status="ready"] {
      background: #14381e;
      color: #4ade80;
    }
    #app-status[data-status="generating"] {
      background: #3e3312;
      color: #facc15;
    }
    #app-status[data-status="error"] {
      background: #441717;
      color: #f87171;
    }
    #download-link,
    #download-image-btn {
      display: inline-block;
      text-align: center;
      padding: 12px;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
    }
    #download-link {
      background: #10b981;
    }
    #download-link:hover {
      background: #059669;
    }
    #download-image-btn {
      background: #4f46e5;
    }
    #download-image-btn:hover {
      background: #4338ca;
    }
    #canvas-container {
      flex: 1;
      height: 100%;
      position: relative;
      min-height: 250px;
      background-color: #111111;
    }
    #preview-container,
    #uploaded-preview-container {
      display: none;
      flex-direction: column;
      gap: 10px;
      background: #1e1e1e;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
    }
    #preview-image,
    #uploaded-image-preview {
      width: 100%;
      height: auto;
      max-height: 160px;
      object-fit: contain;
      background: #141414;
      border-radius: 4px;
      border: 1px solid #444;
    }
    #remove-image-btn {
      background: #dc2626;
      padding: 6px 10px;
      font-size: 12px;
    }
    #remove-image-btn:hover {
      background: #b91c1c;
    }

    /* ปุ่มสลับโหมดสัมผัส 3D */
    #touch-toggle-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 20;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #555;
      color: #fff;
      backdrop-filter: blur(4px);
    }
    #touch-toggle-btn.locked {
      background: rgba(220, 38, 38, 0.8);
      border-color: #ef4444;
    }

    /* Responsive Mobile Mode */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #canvas-container {
        height: 38vh;
        min-height: 240px;
        width: 100%;
        flex: none;
      }
      #sidebar {
        width: 100%;
        min-width: unset;
        height: auto;
        flex: none;
        overflow-y: visible;
        border-right: none;
        border-top: 1px solid #333333;
        padding: 16px;
        padding-bottom: 40px;
      }
      input[type="password"],
      input[type="text"],
      input[type="file"],
      textarea {
        font-size: 16px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container">
    <button id="touch-toggle-btn" type="button">🖐️ โหมดหมุน 3D (แตะเพื่อล็อก)</button>
  </div>

  <div id="sidebar">
    <h1>Agent 3D Builder</h1>
    
    <label for="api-key-input">Gemini API Key:</label>
    <input 
      type="password" 
      id="api-key-input" 
      data-testid="api-key-input" 
      placeholder="ใส่ Gemini API Key ที่นี่" />

    <label for="image-input">อัปโหลดรูปภาพ 2D (ตัวเลือกเสริม):</label>
    <input 
      type="file" 
      id="image-input" 
      data-testid="image-input" 
      accept="image/*" />

    <div id="uploaded-preview-container">
      <img id="uploaded-image-preview" alt="Uploaded Preview" />
      <button id="remove-image-btn" type="button">❌ ลบรูปภาพที่เลือก</button>
    </div>

    <label for="prompt-input">คำอธิบายโมเดล 3D (หรือรายละเอียดเพิ่มเติม):</label>
    <textarea 
      id="prompt-input" 
      data-testid="prompt-input" 
      placeholder="ตัวอย่าง: วาริโอถือถุงทองคำ หรือ บ้านมาริโอ้ไดโอรามา หรือ รายละเอียดเพิ่มเติม"></textarea>

    <button id="generate-btn" data-testid="generate-btn">Generate 3D</button>
    <button id="export-glb-btn" data-testid="export-glb-btn" disabled>Export GLB</button>
    
    <div id="app-status" data-testid="app-status" data-status="idle">Status: Idle</div>
    
    <a id="download-link" data-testid="download-link" style="display: none;" download="model.glb">
      Download Model (.glb)
    </a>

    <div id="preview-container">
      <label>รูปภาพพรีวิว (Snapshot Image):</label>
      <img id="preview-image" data-testid="preview-image" alt="3D Model Preview" />
      <a id="download-image-btn" data-testid="download-image-btn" download="model-preview.png">
        Download Image (.png)
      </a>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    // 1. ลงทะเบียน Service Worker สำหรับรองรับการติดตั้งแอป (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('ServiceWorker registered with scope:', registration.scope);
          })
          .catch((error) => {
            console.error('ServiceWorker registration failed:', error);
          });
      });
    }

    // 2. การตั้งค่า Three.js Scene พร้อม preserveDrawingBuffer สำหรับบันทึกภาพ
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(5, 5, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const touchToggleBtn = document.getElementById('touch-toggle-btn');
    let isTouchLocked = false;

    touchToggleBtn.addEventListener('click', () => {
      isTouchLocked = !isTouchLocked;
      if (isTouchLocked) {
        controls.enabled = false;
        touchToggleBtn.classList.add('locked');
        touchToggleBtn.textContent = '🔒 ล็อกมุมมอง (เลื่อนหน้าจอง่าย)';
      } else {
        controls.enabled = true;
        touchToggleBtn.classList.remove('locked');
        touchToggleBtn.textContent = '🖐️ โหมดหมุน 3D (แตะเพื่อล็อก)';
      }
    });

    // ปรับระบบแสงแบบ Vinyl Toy Studio: แสงหลักบน แสงเสริมส่องลบเงาใต้คาง/หมวก และไฟกึ่งทรงกลม
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(10, 15, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
    fillLight.position.set(0, 2, 10);
    scene.add(fillLight);

    const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
    scene.add(gridHelper);

    const modelGroup = new THREE.Group();
    scene.add(modelGroup);

    function updateViewport() {
      const width = container.clientWidth;
      const height = container.clientHeight;
      if (width > 0 && height > 0) {
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
      }
    }

    window.addEventListener('resize', updateViewport);

    function animate() {
      requestAnimationFrame(animate);
      if (controls.enabled) {
        controls.update();
      }
      renderer.render(scene, camera);
    }
    animate();

    // 3. ฟังก์ชันจัดกล้องให้อยู่ตรงกลางวัตถุอัตโนมัติ
    function fitCameraToObject(object) {
      const box = new THREE.Box3().setFromObject(object);
      if (box.isEmpty()) return;

      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const fov = camera.fov * (Math.PI / 180);
      let cameraDistance = Math.abs(maxDim / 2 / Math.tan(fov / 2));
      cameraDistance *= 2.2;

      camera.position.set(center.x + cameraDistance * 0.7, center.y + cameraDistance * 0.7, center.z + cameraDistance);
      camera.lookAt(center);
      controls.target.copy(center);
      controls.update();
    }

    // 4. ฟังก์ชันสร้างโมเดล 3D จาก JSON Spec ที่รองรับรูปทรงซับซ้อน
    function renderModel(spec) {
      while (modelGroup.children.length > 0) {
        const obj = modelGroup.children[0];
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) obj.material.dispose();
        modelGroup.remove(obj);
      }

      if (!spec.objects || !Array.isArray(spec.objects)) return;

      spec.objects.forEach(item => {
        let geometry;
        const p = item.parameters || {};

        if (item.type === 'box') {
          geometry = new THREE.BoxGeometry(p.width || 1, p.height || 1, p.depth || 1);
        } else if (item.type === 'cylinder') {
          geometry = new THREE.CylinderGeometry(
            p.radiusTop !== undefined ? p.radiusTop : 0.5,
            p.radiusBottom !== undefined ? p.radiusBottom : 0.5,
            p.height || 1,
            p.radialSegments || 32
          );
        } else if (item.type === 'sphere') {
          geometry = new THREE.SphereGeometry(
            p.radius || 0.5,
            p.widthSegments || 32,
            p.heightSegments || 16
          );
        } else if (item.type === 'cone') {
          geometry = new THREE.ConeGeometry(
            p.radius || 0.5,
            p.height || 1,
            p.radialSegments || 32
          );
        } else if (item.type === 'torus') {
          geometry = new THREE.TorusGeometry(
            p.radius || 0.5,
            p.tube || 0.2,
            p.radialSegments || 16,
            p.tubularSegments || 32
          );
        } else if (item.type === 'capsule') {
          geometry = new THREE.CapsuleGeometry(
            p.radius || 0.5,
            p.length || 1,
            p.capSubdivisions || 8,
            p.radialSegments || 16
          );
        } else if (item.type === 'lathe') {
          const rawPoints = (p.points && Array.isArray(p.points) && p.points.length > 1) ? p.points : [[0, 0], [0.5, 0.5], [0.3, 1], [0, 1]];
          const points = rawPoints.map(pt => new THREE.Vector2(Math.max(0, pt[0]), pt[1]));
          geometry = new THREE.LatheGeometry(points, p.segments || 32);
        } else if (item.type === 'extrude') {
          const shape = new THREE.Shape();
          const pts = (p.shape && Array.isArray(p.shape) && p.shape.length >= 3) ? p.shape : [[0, 0], [1, 0], [0.5, 1]];
          shape.moveTo(pts[0][0], pts[0][1]);
          for (let i = 1; i < pts.length; i++) {
            shape.lineTo(pts[i][0], pts[i][1]);
          }
          shape.closePath();

          const extrudeSettings = {
            depth: p.depth !== undefined ? p.depth : 0.5,
            bevelEnabled: p.bevelEnabled !== undefined ? p.bevelEnabled : true,
            bevelSegments: p.bevelSegments || 2,
            steps: 1,
            bevelSize: p.bevelSize !== undefined ? p.bevelSize : 0.04,
            bevelThickness: p.bevelThickness !== undefined ? p.bevelThickness : 0.04
          };
          geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        } else if (item.type === 'dodecahedron') {
          geometry = new THREE.DodecahedronGeometry(p.radius || 0.5, p.detail || 0);
        } else if (item.type === 'icosahedron') {
          geometry = new THREE.IcosahedronGeometry(p.radius || 0.5, p.detail || 0);
        }

        if (geometry) {
          // ค่าผิวสัมผัสสไตล์ Matte Vinyl Toy
          const material = new THREE.MeshStandardMaterial({
            color: item.color || '#cccccc',
            metalness: item.metalness !== undefined ? item.metalness : 0.05,
            roughness: item.roughness !== undefined ? item.roughness : 0.65
          });

          const mesh = new THREE.Mesh(geometry, material);
          if (item.position && Array.isArray(item.position)) mesh.position.set(...item.position);
          if (item.rotation && Array.isArray(item.rotation)) mesh.rotation.set(...item.rotation);
          if (item.scale && Array.isArray(item.scale)) mesh.scale.set(...item.scale);
          
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          modelGroup.add(mesh);
        }
      });

      fitCameraToObject(modelGroup);
      renderer.render(scene, camera);

      const dataUrl = renderer.domElement.toDataURL('image/png');
      const previewContainer = document.getElementById('preview-container');
      const previewImg = document.getElementById('preview-image');
      const downloadImgBtn = document.getElementById('download-image-btn');

      previewImg.src = dataUrl;
      downloadImgBtn.href = dataUrl;
      previewContainer.style.display = 'flex';
    }

    // 5. จัดการ Element และการเชื่อมต่อ Gemini API
    const apiKeyInput = document.getElementById('api-key-input');
    const imageInput = document.getElementById('image-input');
    const uploadedPreviewContainer = document.getElementById('uploaded-preview-container');
    const uploadedImagePreview = document.getElementById('uploaded-image-preview');
    const removeImageBtn = document.getElementById('remove-image-btn');
    const promptInput = document.getElementById('prompt-input');
    const generateBtn = document.getElementById('generate-btn');
    const exportBtn = document.getElementById('export-glb-btn');
    const appStatus = document.getElementById('app-status');
    const downloadLink = document.getElementById('download-link');
    const previewContainer = document.getElementById('preview-container');

    let currentImageBase64 = null;
    let currentImageMimeType = null;

    const savedApiKey = localStorage.getItem('gemini_api_key');
    if (savedApiKey) {
      apiKeyInput.value = savedApiKey;
    }

    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
    });

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const result = event.target.result;
        uploadedImagePreview.src = result;
        uploadedPreviewContainer.style.display = 'flex';

        const match = result.match(/^data:(image\/[a-zA-Z+]+);base64,(.+)$/);
        if (match) {
          currentImageMimeType = match[1];
          currentImageBase64 = match[2];
        }
      };
      reader.readAsDataURL(file);
    });

    removeImageBtn.addEventListener('click', () => {
      imageInput.value = '';
      currentImageBase64 = null;
      currentImageMimeType = null;
      uploadedPreviewContainer.style.display = 'none';
      uploadedImagePreview.src = '';
    });

    function setStatus(state, message) {
      appStatus.setAttribute('data-status', state);
      appStatus.textContent = `Status: ${message}`;
    }

    const SYSTEM_PROMPT = `
You are a master 3D stylized procedural modeler specialized in Nintendo-style collectible vinyl figures and isometric dioramas.
Deconstruct the user's natural language request and/or 2D reference image into 45 to 80 carefully positioned primitives.
You MUST output ONLY a valid JSON object matching this schema:
{
  "objects": [
    {
      "type": "box" | "cylinder" | "sphere" | "cone" | "torus" | "capsule" | "lathe" | "extrude" | "dodecahedron" | "icosahedron",
      "parameters": {
        // for box: "width": float, "height": float, "depth": float
        // for cylinder: "radiusTop": float, "radiusBottom": float, "height": float, "radialSegments": int
        // for sphere: "radius": float, "widthSegments": int, "heightSegments": int
        // for cone: "radius": float, "height": float, "radialSegments": int
        // for torus: "radius": float, "tube": float, "radialSegments": int, "tubularSegments": int
        // for capsule: "radius": float, "length": float
        // for lathe: "points": [[x, y], ...], "segments": int
        // for extrude: "shape": [[x, y], ...], "depth": float, "bevelEnabled": bool, "bevelThickness": float, "bevelSize": float
        // for dodecahedron / icosahedron: "radius": float
      },
      "position": [x, y, z],
      "rotation": [rotX_radians, rotY_radians, rotZ_radians],
      "scale": [scaleX, scaleY, scaleZ], // optional, default [1, 1, 1]
      "color": "#hexcode",
      "metalness": float_0_to_1,
      "roughness": float_0_to_1
    }
  ]
}

ARCHETYPE-SPECIFIC MODELING GUIDELINES:

1. HUMANS & PLUMBERS (Mario, Luigi, Wario):
   - Head & Face:
     * Luigi: Slim, elongated oval head, prominent nose, smooth curved mustache.
     * Wario: Wide head, pointed elf ears (tilted cones on sides), huge hot-pink bulbous teardrop nose (#ff4081 or #e91e63), and jagged zigzag mustache (use extrude or angled boxes/capsules).
     * Cap & Visor: Cap dome on top; visor MUST protrude forward (+Z) angled downward. Add white emblem circle decal with logo (L, W, M) on front.
   - Overalls & Costume:
     * Colored shirt base + blue/purple overalls. Include shoulder straps and two distinct yellow button discs (#ffd700) on the chest.
     * White gloves with cuffs; chunky shoes/boots with thick sole layer.
   - Props (e.g. Wario's Money Bag):
     * Bag: Large cream/tan sphere (#e6d7b8) pinched at the top neck with a cylinder collar and ruffled top. Add brown 'W' badge on the bag face.
     * Gold coins: Thin yellow/gold cylinders (#ffd700) overflowing from the bag and scattered on the floor plate.

2. APES & PRIMATES (Donkey Kong):
   - Crest: Pointed hair swirl tuft on top of head (curved cone or extrude).
   - Face: Tan/peach rounded muzzle/jaw protruding forward; dark brown hooded brow ridge with eyes nestled underneath.
   - Muscular Build: Broad shoulder capsules, heavy curved forearms, large clenched fists with fingers.
   - Chest & Tie: Light tan muscular chest/belly plate overlapping deep brown torso. Red necktie (#e52521) draping down the chest with yellow "DK" badge.

3. REPTILES, TURTLES & DRAGONS (Yoshi, Koopa Troopa, Bowser Jr):
   - Snouts & Jaws: Big protruding bulbous green/orange muzzle on +Z. Light cream/white jaw and cheeks wrapping beneath.
   - Eyes: Two tall vertical oval globes (scale [0.6, 1.2, 0.6]) close together atop the snout with dark pupils.
   - Shells:
     * Rounded dome shell on back (-Z).
     * Thick white/cream perimeter rim using a torus.
     * Belly plate divided into yellow/cream ribbed sections.
   - Spikes & Collars (Bowser Jr):
     * Red topknot hair tuft (curved cones).
     * Spiked collars: Black torus bands with tiny white cone spikes around neck and wrists.
     * Bib/Bandana: Curved triangular chest plate with drawing/flame accents.
     * Junior Clown Car (if present): Large white bowl-shaped vehicle (lathe or scaled sphere), rimmed cockpit, cartoon face with mouth on vehicle front, small green/yellow propeller underneath.

4. BUILDINGS & DIORAMAS (Mario House Isometric):
   - Ground Base: Chamfered square plinth (dirt/brown box) topped with a vibrant green grass plate and stone pathway tiles.
   - House Architecture: Red cross-gabled brick roof made with intersecting wedges/boxes. Brick textured main walls, arched doorway with round peephole window.
   - Details & Props: Brick chimney with graduated white/grey smoke puff spheres rising up, floating yellow question-mark [?] block, golden coin atop roof, small mushrooms and flower tufts around the yard.

5. COLOR & FINISH:
   - Use vivid, saturated Nintendo palette colors.
   - Keep metalness low (0.02 - 0.08) and roughness medium-high (0.6 - 0.75) for a premium matte vinyl toy appearance.
   - Always allocate 45 to 80 primitives to build every iconic element and avoid leaving major silhouettes flat.
`;

    generateBtn.addEventListener('click', async () => {
      const apiKey = apiKeyInput.value.trim();
      const prompt = promptInput.value.trim();

      if (!apiKey) {
        setStatus('error', 'กรุณาระบุ Gemini API Key ก่อน');
        return;
      }

      if (!prompt && !currentImageBase64) {
        setStatus('error', 'กรุณาระบุคำอธิบายโมเดล 3D หรืออัปโหลดรูปภาพ 2D');
        return;
      }

      setStatus('generating', 'Connecting to Gemini API...');
      generateBtn.disabled = true;
      exportBtn.disabled = true;
      downloadLink.style.display = 'none';
      previewContainer.style.display = 'none';

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`;

      const parts = [];
      if (currentImageBase64) {
        parts.push({
          inline_data: {
            mime_type: currentImageMimeType || 'image/jpeg',
            data: currentImageBase64
          }
        });
      }

      const userText = prompt || 'วิเคราะห์ภาพอ้างอิงนี้และถอดแบบเป็นโมเดล 3D สไตล์ฟิกเกอร์ไวนิลอย่างละเอียดครบถ้วนทุกจุดเด่น ทั้งรูปทรง จมูก หนวด กระดอง พร็อพ และท่าทาง';
      parts.push({ text: userText });

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [
              {
                parts: parts
              }
            ],
            systemInstruction: {
              parts: [{ text: SYSTEM_PROMPT }]
            },
            generationConfig: {
              responseMimeType: "application/json",
              temperature: 0.1
            }
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        
        if (!rawText) {
          throw new Error('ไม่พบข้อมูลตอบกลับจากโมเดล');
        }

        const specData = JSON.parse(rawText);
        renderModel(specData);
        
        setStatus('ready', 'สร้างโมเดล 3D สำเร็จเรียบร้อย');
        exportBtn.disabled = false;
      } catch (err) {
        setStatus('error', 'เกิดข้อผิดพลาด: ' + err.message);
      } finally {
        generateBtn.disabled = false;
      }
    });

    exportBtn.addEventListener('click', () => {
      setStatus('generating', 'กำลังสร้างไฟล์ GLB...');
      const exporter = new GLTFExporter();
      exporter.parse(
        modelGroup,
        (glb) => {
          const blob = new Blob([glb], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(blob);
          downloadLink.href = url;
          downloadLink.style.display = 'block';
          setStatus('ready', 'Export สำเร็จ! กดดาวน์โหลดไฟล์ด้านล่าง');
        },
        (error) => {
          setStatus('error', 'Export error: ' + error.message);
        },
        { binary: true }
      );
    });

    setTimeout(updateViewport, 100);
  </script>
</body>
</html>
