<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pocket 3D Modeler</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <div class="brand">Pocket 3D</div>
      <div class="top-actions">
        <button id="btn-clear" class="btn-icon" title="Clear Scene">🗑️</button>
        <button id="btn-export-glb" class="btn-primary">GLB</button>
        <button id="btn-export-obj" class="btn-secondary">OBJ</button>
      </div>
    </header>

    <div id="canvas-container"></div>

    <div id="bottom-sheet" class="bottom-sheet">
      <div class="sheet-handle" id="sheet-toggle"></div>
      <div class="sheet-content">
        <div class="sheet-row">
          <span class="label">โหมด Gizmo</span>
          <div class="segmented-control">
            <button class="seg-btn active" data-mode="translate">ย้าย</button>
            <button class="seg-btn" data-mode="rotate">หมุน</button>
            <button class="seg-btn" data-mode="scale">ย่อ/ขยาย</button>
          </div>
        </div>

        <div class="sheet-row">
          <span class="label">สีวัตถุ</span>
          <input type="color" id="mat-color" value="#4f46e5">
        </div>

        <div class="sheet-row">
          <span class="label">ความเงา (Roughness)</span>
          <input type="range" id="mat-roughness" min="0" max="1" step="0.05" value="0.4">
        </div>

        <div class="sheet-row">
          <button id="btn-delete" class="btn-danger">ลบวัตถุที่เลือก</button>
        </div>
      </div>
    </div>

    <nav class="bottom-bar">
      <button class="action-btn" id="btn-add-cube">
        <span class="icon">📦</span>
        <span class="text">Cube</span>
      </button>
      <button class="action-btn" id="btn-add-sphere">
        <span class="icon">⚪</span>
        <span class="text">Sphere</span>
      </button>
      <button class="action-btn" id="btn-add-cylinder">
        <span class="icon">🥫</span>
        <span class="text">Cylinder</span>
      </button>
      <button class="action-btn" id="btn-snap-grid">
        <span class="icon">🧲</span>
        <span class="text">Snap Grid</span>
      </button>
    </nav>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
