<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent 3D Builder</title>

  <!-- PWA & Mobile Web App Settings -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="3D Builder">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex;
      flex-direction: row;
      height: 100vh;
      background-color: #1a1a1a;
      color: #ffffff;
      overflow: hidden;
    }
    #sidebar {
      width: 380px;
      min-width: 320px;
      padding: 20px;
      background: #242424;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-right: 1px solid #333333;
      z-index: 10;
      overflow-y: auto;
    }
    h1 {
      font-size: 1.2rem;
      color: #00d2ff;
    }
    label {
      font-size: 13px;
      color: #cccccc;
      margin-bottom: -6px;
    }
    input[type="password"],
    input[type="text"],
    input[type="file"],
    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #181818;
      color: #fff;
      font-size: 14px;
      line-height: 1.5;
    }
    input[type="file"] {
      padding: 8px;
      cursor: pointer;
    }
    textarea {
      height: 85px;
      resize: vertical;
    }
    button {
      padding: 12px 16px;
      border-radius: 6px;
      border: none;
      background: #0084ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 14px;
    }
    button:hover:not(:disabled) {
      background: #0070d6;
    }
    button:disabled {
      background: #555555;
      cursor: not-allowed;
    }
    #undo-btn {
      background: #6b7280;
    }
    #undo-btn:hover:not(:disabled) {
      background: #4b5563;
    }
    #reset-btn {
      background: #dc2626;
    }
    #reset-btn:hover:not(:disabled) {
      background: #b91c1c;
    }
    #export-glb-btn {
      background: #28a745;
    }
    #export-glb-btn:hover:not(:disabled) {
      background: #218838;
    }
    #app-status {
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 13px;
      background: #333333;
      color: #bbbbbb;
      word-break: break-word;
    }
    #app-status[data-status="ready"] {
      background: #14381e;
      color: #4ade80;
    }
    #app-status[data-status="generating"] {
      background: #3e3312;
      color: #facc15;
    }
    #app-status[data-status="error"] {
      background: #441717;
      color: #f87171;
    }
    #download-link,
    #download-image-btn {
      display: inline-block;
      text-align: center;
      padding: 12px;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
    }
    #download-link {
      background: #10b981;
    }
    #download-link:hover {
      background: #059669;
    }
    #download-image-btn {
      background: #4f46e5;
    }
    #download-image-btn:hover {
      background: #4338ca;
    }
    #canvas-container {
      flex: 1;
      height: 100%;
      position: relative;
      min-height: 250px;
      background-color: #111111;
    }
    #preview-container,
    #uploaded-preview-container-front,
    #uploaded-preview-container-side {
      display: none;
      flex-direction: column;
      gap: 10px;
      background: #1e1e1e;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
    }
    #preview-image,
    #uploaded-image-preview-front,
    #uploaded-image-preview-side {
      width: 100%;
      height: auto;
      max-height: 140px;
      object-fit: contain;
      background: #141414;
      border-radius: 4px;
      border: 1px solid #444;
    }
    #remove-image-btn-front,
    #remove-image-btn-side {
      background: #dc2626;
      padding: 6px 10px;
      font-size: 12px;
    }
    #remove-image-btn-front:hover,
    #remove-image-btn-side:hover {
      background: #b91c1c;
    }

    #history-box {
      background: #181818;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 12px;
      font-size: 12px;
      display: none;
      flex-direction: column;
      gap: 6px;
      max-height: 130px;
      overflow-y: auto;
    }
    #history-box-title {
      font-size: 12px;
      font-weight: bold;
      color: #00d2ff;
      margin-bottom: 2px;
    }
    #history-list {
      list-style-type: decimal;
      padding-left: 18px;
      color: #bbbbbb;
      display: flex;
      flex-direction: column;
      gap: 4px;
      word-break: break-word;
    }

    /* Smart Pose Library Panel */
    #pose-container {
      background: #1c2430;
      border: 1px solid #2d3748;
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #pose-title {
      font-size: 13px;
      font-weight: bold;
      color: #60a5fa;
    }
    .pose-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .pose-btn {
      padding: 8px 10px;
      font-size: 12px;
      background: #374151;
      border-radius: 4px;
      font-weight: normal;
    }
    .pose-btn:hover:not(:disabled) {
      background: #4b5563;
    }

    /* Inspector ปรับแต่งชิ้นส่วน 3D */
    #inspector-container {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 6px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    #inspector-header {
      font-size: 13px;
      font-weight: bold;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #selected-part-id {
      background: #111827;
      padding: 2px 6px;
      border-radius: 4px;
      color: #facc15;
      font-size: 12px;
    }
    .inspector-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
    }
    .inspector-row input[type="color"] {
      border: none;
      width: 48px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      background: transparent;
    }
    .inspector-row input[type="range"] {
      flex: 1;
    }
    #delete-part-btn {
      background: #ef4444;
      padding: 8px;
      font-size: 12px;
    }
    #delete-part-btn:hover {
      background: #dc2626;
    }

    /* แผงควบคุม Transform Gizmo บน Canvas */
    #gizmo-toolbar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.8);
      padding: 6px;
      border-radius: 30px;
      border: 1px solid #444;
      backdrop-filter: blur(6px);
    }
    .gizmo-btn {
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 20px;
      background: #2a2a2a;
      border: 1px solid #555;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }
    .gizmo-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
    }
    .gizmo-btn:hover:not(.active) {
      background: #3a3a3a;
    }

    /* ปุ่มสลับโหมดสัมผัส 3D */
    #touch-toggle-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 20;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #555;
      color: #fff;
      backdrop-filter: blur(4px);
    }
    #touch-toggle-btn.locked {
      background: rgba(220, 38, 38, 0.8);
      border-color: #ef4444;
    }

    /* Responsive Mobile Mode */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      #canvas-container {
        height: 42vh;
        min-height: 260px;
        width: 100%;
        flex: none;
      }
      #sidebar {
        width: 100%;
        min-width: unset;
        height: auto;
        flex: none;
        overflow-y: visible;
        border-right: none;
        border-top: 1px solid #333333;
        padding: 16px;
        padding-bottom: 40px;
      }
      #gizmo-toolbar {
        bottom: 8px;
        padding: 4px;
        gap: 4px;
      }
      .gizmo-btn {
        padding: 4px 8px;
        font-size: 11px;
      }
      input[type="password"],
      input[type="text"],
      input[type="file"],
      textarea {
        font-size: 16px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container">
    <button id="touch-toggle-btn" type="button">🖐️ โหมดหมุน 3D (แตะเพื่อล็อก)</button>
    
    <div id="gizmo-toolbar">
      <button id="gizmo-translate" class="gizmo-btn active" type="button" title="Translate (เลื่อนตำแหน่ง)">✥ ย้าย</button>
      <button id="gizmo-rotate" class="gizmo-btn" type="button" title="Rotate (หมุนองศา)">🔄 หมุน</button>
      <button id="gizmo-scale" class="gizmo-btn" type="button" title="Scale (ยืด/ขยาย)">📐 ขยาย</button>
      <button id="gizmo-deselect" class="gizmo-btn" type="button" title="Deselect (ปลดการเลือก)">❌ ปลดเลือก</button>
    </div>
  </div>

  <div id="sidebar">
    <h1>Agent 3D Builder</h1>
    
    <label for="api-key-input">Gemini API Key:</label>
    <input 
      type="password" 
      id="api-key-input" 
      data-testid="api-key-input" 
      placeholder="ใส่ Gemini API Key ที่นี่" />

    <!-- Multi-View Image Reference -->
    <label for="image-input-front">1. ภาพมุมหน้า (Front View Reference):</label>
    <input 
      type="file" 
      id="image-input-front" 
      data-testid="image-input-front" 
      accept="image/*" />

    <div id="uploaded-preview-container-front">
      <img id="uploaded-image-preview-front" alt="Front Preview" />
      <button id="remove-image-btn-front" type="button">❌ ลบรูปภาพมุมหน้า</button>
    </div>

    <label for="image-input-side">2. ภาพมุมข้าง (Side View Reference - ตัวเลือกเสริม):</label>
    <input 
      type="file" 
      id="image-input-side" 
      data-testid="image-input-side" 
      accept="image/*" />

    <div id="uploaded-preview-container-side">
      <img id="uploaded-image-preview-side" alt="Side Preview" />
      <button id="remove-image-btn-side" type="button">❌ ลบรูปภาพมุมข้าง</button>
    </div>

    <label for="prompt-input">คำอธิบายโมเดล 3D (หรือคำสั่งปรับปรุงต่อยอด):</label>
    <textarea 
      id="prompt-input" 
      data-testid="prompt-input" 
      placeholder="ตัวอย่าง: Firey บอลไฟกลมอ้วน 3D หรือ หุ่นยนต์แมวอวกาศ"></textarea>

    <!-- Smart Pose Library -->
    <div id="pose-container">
      <div id="pose-title">🏃 Smart Pose Library (จัดท่าทางอัตโนมัติ):</div>
      <div class="pose-grid">
        <button id="pose-stand-btn" class="pose-btn" type="button" disabled>🧍 ยืนตรง</button>
        <button id="pose-run-btn" class="pose-btn" type="button" disabled>🏃 ท่าวิ่ง</button>
        <button id="pose-sit-btn" class="pose-btn" type="button" disabled>🪑 ท่านั่ง</button>
        <button id="pose-wave-btn" class="pose-btn" type="button" disabled>👋 โบกมือทักทาย</button>
      </div>
    </div>

    <!-- กล่องปรับแต่งชิ้นส่วนที่เลือก (Inspector) -->
    <div id="inspector-container">
      <div id="inspector-header">
        <span>⚙️ ชิ้นส่วนที่เลือก</span>
        <span id="selected-part-id">-</span>
      </div>
      <div class="inspector-row">
        <span>สีชิ้นส่วน:</span>
        <input type="color" id="part-color-input" value="#cccccc" />
      </div>
      <div class="inspector-row">
        <span>Roughness (ด้าน): <strong id="roughness-val">0.65</strong></span>
        <input type="range" id="part-roughness-input" min="0" max="1" step="0.05" value="0.65" />
      </div>
      <div class="inspector-row">
        <span>Metalness (โลหะ): <strong id="metalness-val">0.05</strong></span>
        <input type="range" id="part-metalness-input" min="0" max="1" step="0.05" value="0.05" />
      </div>
      <button id="delete-part-btn" type="button">🗑️ ลบชิ้นส่วนนี้ออกจากโมเดล</button>
    </div>

    <div id="history-box">
      <div id="history-box-title">ลำดับการปรับปรุงคำสั่งสะสม (Iterative History):</div>
      <ol id="history-list"></ol>
    </div>

    <button id="generate-btn" data-testid="generate-btn">Generate 3D</button>
    <button id="undo-btn" data-testid="undo-btn" disabled>↩️ ย้อนกลับทรงก่อนหน้า</button>
    <button id="reset-btn" data-testid="reset-btn">🧹 ล้างคำสั่ง / เริ่มโมเดลใหม่</button>
    <button id="export-glb-btn" data-testid="export-glb-btn" disabled>Export GLB</button>
    
    <div id="app-status" data-testid="app-status" data-status="idle">Status: Idle</div>
    
    <a id="download-link" data-testid="download-link" style="display: none;" download="model.glb">
      Download Model (.glb)
    </a>

    <div id="preview-container">
      <label>รูปภาพพรีวิว (Snapshot Image):</label>
      <img id="preview-image" data-testid="preview-image" alt="3D Model Preview" />
      <a id="download-image-btn" data-testid="download-image-btn" download="model-preview.png">
        Download Image (.png)
      </a>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';

    // 1. ลงทะเบียน Service Worker สำหรับรองรับการติดตั้งแอป (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((registration) => {
            console.log('ServiceWorker registered with scope:', registration.scope);
          })
          .catch((error) => {
            console.error('ServiceWorker registration failed:', error);
          });
      });
    }

    // 2. การตั้งค่า Three.js Scene พร้อม preserveDrawingBuffer สำหรับบันทึกภาพ
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(5, 5, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // ระบบ TransformControls (3D Gizmo)
    const transformControls = new TransformControls(camera, renderer.domElement);
    scene.add(transformControls);

    transformControls.addEventListener('dragging-changed', (event) => {
      controls.enabled = !event.value;
    });

    const touchToggleBtn = document.getElementById('touch-toggle-btn');
    let isTouchLocked = false;

    touchToggleBtn.addEventListener('click', () => {
      isTouchLocked = !isTouchLocked;
      if (isTouchLocked) {
        controls.enabled = false;
        touchToggleBtn.classList.add('locked');
        touchToggleBtn.textContent = '🔒 ล็อกมุมมอง (เลื่อนหน้าจอง่าย)';
      } else {
        controls.enabled = true;
        touchToggleBtn.classList.remove('locked');
        touchToggleBtn.textContent = '🖐️ โหมดหมุน 3D (แตะเพื่อล็อก)';
      }
    });

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4);
    hemiLight.position.set(0, 20, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(10, 15, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
    fillLight.position.set(0, 2, 10);
    scene.add(fillLight);

    const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
    scene.add(gridHelper);

    const modelGroup = new THREE.Group();
    scene.add(modelGroup);

    function updateViewport() {
      const width = container.clientWidth;
      const height = container.clientHeight;
      if (width > 0 && height > 0) {
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
      }
    }

    window.addEventListener('resize', updateViewport);

    function animate() {
      requestAnimationFrame(animate);
      if (controls.enabled) {
        controls.update();
      }
      renderer.render(scene, camera);
    }
    animate();

    // ฟังก์ชันจัดการล้างหน่วยความจำแบบ Recursive เพื่อรองรับ Hierarchy
    function disposeObject(obj) {
      if (obj.children) {
        while (obj.children.length > 0) {
          disposeObject(obj.children[0]);
          obj.remove(obj.children[0]);
        }
      }
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) {
        if (Array.isArray(obj.material)) {
          obj.material.forEach(m => m.dispose());
        } else {
          obj.material.dispose();
        }
      }
    }

    // 3. ฟังก์ชันจัดกล้องให้อยู่ตรงกลางวัตถุอัตโนมัติ
    function fitCameraToObject(object) {
      const box = new THREE.Box3().setFromObject(object);
      if (box.isEmpty()) return;

      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const fov = camera.fov * (Math.PI / 180);
      let cameraDistance = Math.abs(maxDim / 2 / Math.tan(fov / 2));
      cameraDistance *= 2.2;

      camera.position.set(center.x + cameraDistance * 0.7, center.y + cameraDistance * 0.7, center.z + cameraDistance);
      camera.lookAt(center);
      controls.target.copy(center);
      controls.update();
    }

    // ฟังก์ชันอัปเดตรูปพรีวิว Snapshot
    function updatePreviewSnapshot() {
      renderer.render(scene, camera);
      const dataUrl = renderer.domElement.toDataURL('image/png');
      const previewContainer = document.getElementById('preview-container');
      const previewImg = document.getElementById('preview-image');
      const downloadImgBtn = document.getElementById('download-image-btn');

      previewImg.src = dataUrl;
      downloadImgBtn.href = dataUrl;
      previewContainer.style.display = 'flex';
    }

    // 4. ฟังก์ชันสร้างโมเดล 3D แบบ Ultra-Smooth High-Fidelity Geometry
    function renderModel(spec) {
      deselectPart();

      while (modelGroup.children.length > 0) {
        const obj = modelGroup.children[0];
        disposeObject(obj);
        modelGroup.remove(obj);
      }

      if (!spec.objects || !Array.isArray(spec.objects)) return;

      const objectMap = new Map();

      spec.objects.forEach((item, index) => {
        let geometry;
        const p = item.parameters || {};

        if (item.type === 'box') {
          geometry = new THREE.BoxGeometry(p.width || 1, p.height || 1, p.depth || 1);
        } else if (item.type === 'cylinder') {
          geometry = new THREE.CylinderGeometry(
            p.radiusTop !== undefined ? p.radiusTop : 0.5,
            p.radiusBottom !== undefined ? p.radiusBottom : 0.5,
            p.height || 1,
            p.radialSegments || 48
          );
        } else if (item.type === 'sphere') {
          geometry = new THREE.SphereGeometry(
            p.radius || 0.5,
            p.widthSegments || 48,
            p.heightSegments || 32
          );
        } else if (item.type === 'cone') {
          geometry = new THREE.ConeGeometry(
            p.radius || 0.5,
            p.height || 1,
            p.radialSegments || 48
          );
        } else if (item.type === 'torus') {
          geometry = new THREE.TorusGeometry(
            p.radius || 0.5,
            p.tube || 0.2,
            p.radialSegments || 32,
            p.tubularSegments || 48
          );
        } else if (item.type === 'capsule') {
          geometry = new THREE.CapsuleGeometry(
            p.radius || 0.5,
            p.length || 1,
            p.capSubdivisions || 16,
            p.radialSegments || 32
          );
        } else if (item.type === 'lathe') {
          const rawPoints = (p.points && Array.isArray(p.points) && p.points.length > 1) ? p.points : [[0, 0], [0.5, 0.5], [0.3, 1], [0, 1]];
          const points = rawPoints.map(pt => new THREE.Vector2(Math.max(0, pt[0]), pt[1]));
          geometry = new THREE.LatheGeometry(points, p.segments || 48);
        } else if (item.type === 'extrude') {
          const shape = new THREE.Shape();
          const pts = (p.shape && Array.isArray(p.shape) && p.shape.length >= 3) ? p.shape : [[0, 0], [1, 0], [0.5, 1]];
          shape.moveTo(pts[0][0], pts[0][1]);
          for (let i = 1; i < pts.length; i++) {
            shape.lineTo(pts[i][0], pts[i][1]);
          }
          shape.closePath();

          const extrudeSettings = {
            depth: p.depth !== undefined ? p.depth : 0.35,
            bevelEnabled: p.bevelEnabled !== undefined ? p.bevelEnabled : true,
            bevelSegments: p.bevelSegments || 6,
            steps: 2,
            bevelSize: p.bevelSize !== undefined ? p.bevelSize : 0.05,
            bevelThickness: p.bevelThickness !== undefined ? p.bevelThickness : 0.05
          };
          geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        } else if (item.type === 'tube') {
          const rawPath = (p.path && Array.isArray(p.path) && p.path.length > 1)
            ? p.path.map(pt => new THREE.Vector3(...pt))
            : [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 1, 0)];
          const curve = new THREE.CatmullRomCurve3(rawPath);
          geometry = new THREE.TubeGeometry(
            curve,
            p.tubularSegments || 48,
            p.radius || 0.035,
            p.radialSegments || 16,
            p.closed || false
          );
        } else if (item.type === 'plane') {
          geometry = new THREE.PlaneGeometry(p.width || 1, p.height || 1);
        } else if (item.type === 'dodecahedron') {
          geometry = new THREE.DodecahedronGeometry(p.radius || 0.5, p.detail || 0);
        } else if (item.type === 'icosahedron') {

            metalness: item.metalness !== undefined ? item.metalness : 0.05,
            roughness: item.roughness !== undefined ? item.roughness : 0.65,
            side: item.type === 'plane' ? THREE.DoubleSide : THREE.FrontSide
          });

          const mesh = new THREE.Mesh(geometry, material);
          if (item.position && Array.isArray(item.position)) mesh.position.set(...item.position);
          if (item.rotation && Array.isArray(item.rotation)) mesh.rotation.set(...item.rotation);
          if (item.scale && Array.isArray(item.scale)) mesh.scale.set(...item.scale);
          
          mesh.castShadow = true;
          mesh.receiveShadow = true;

          const itemId = item.id || `obj_${index}`;
          mesh.userData = { id: itemId };
          objectMap.set(itemId, mesh);

          if (item.parent && objectMap.has(item.parent)) {
            objectMap.get(item.parent).add(mesh);
          } else {
            modelGroup.add(mesh);
          }
        }
      });

      fitCameraToObject(modelGroup);
      updatePreviewSnapshot();
    }

    container.addEventListener('pointerup', (e) => {
      if (e.target !== renderer.domElement) return;
      const dist = Math.hypot(e.clientX - pointerDownCoord.x, e.clientY - pointerDownCoord.y);
      if (dist > 5) return;
      if (transformControls.dragging) return;

      const rect = renderer.domElement.getBoundingClientRect();
      const mouse = new THREE.Vector2(
        ((e.clientX - rect.left) / rect.width) * 2 - 1,
        -((e.clientY - rect.top) / rect.height) * 2 + 1
      );

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(modelGroup.children, true);

      if (intersects.length > 0) {
        let hitObj = intersects[0].object;
        while (hitObj && !hitObj.userData?.id && hitObj.parent && hitObj.parent !== modelGroup) {

            ],
            systemInstruction: {
              parts: [{ text: SYSTEM_PROMPT }]
            },
            generationConfig: {
              responseMimeType: "application/json",
              temperature: 0.1
            }
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        
        if (!rawText) {
          throw new Error('ไม่พบข้อมูลตอบกลับจากโมเดล');
        }

        const sanitizedText = rawText.replace(/^```json\s*/i, '').replace(/\s*```$/i, '').trim();
        const specData = JSON.parse(sanitizedText);
        
        currentSpec = specData;
        promptSession.push(actionLabel);
        modelHistory.push({
          spec: JSON.parse(JSON.stringify(specData)),
          session: [...promptSession]
        });

        renderModel(specData);
        promptInput.value = '';
        
        setStatus('ready', promptSession.length > 1 ? `ปรับปรุงโมเดลเรียบร้อย (ขั้นตอนที่ ${promptSession.length})` : 'สร้างโมเดล 3D สำเร็จเรียบร้อย');
        exportBtn.disabled = false;
      } catch (err) {
        setStatus('error', 'เกิดข้อผิดพลาด: ' + err.message);
      } finally {
        generateBtn.disabled = false;
        resetBtn.disabled = false;
        updatePoseButtonsState();
        updateHistoryUI();
        updateUndoButtonState();
      }
    });

    // ฟังก์ชันสั่งจัดท่าทางผ่าน Smart Pose Library
    async function applySmartPose(poseName, poseInstruction) {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        setStatus('error', 'กรุณาระบุ Gemini API Key ก่อน');
        return;
      }
      if (!currentSpec) {
        setStatus('error', 'ต้องสร้างโมเดล 3D ก่อนจึงจะจัดท่าทางได้');
        return;
      }

      setStatus('generating', `AI กำลังคำนวณการจัดท่าทาง: ${poseName}...`);
      generateBtn.disabled = true;
      undoBtn.disabled = true;
      resetBtn.disabled = true;
      exportBtn.disabled = true;
      poseButtons.forEach(btn => btn.disabled = true);

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`;

      const userText = `CURRENT ACTIVE 3D MODEL JSON:\n${JSON.stringify(currentSpec)}\n\nKINEMATIC POSE ADJUSTMENT REQUEST:\nPose: "${poseName}".\nInstruction: ${poseInstruction}\n\nSTRICT INSTRUCTIONS: Adjust ONLY the "rotation" and local "position" of joint and limb child parts (arms, elbows, legs, head) to form this pose anatomically. Do NOT change colors, geometries, or delete existing object IDs. Output the full updated JSON.`;

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: userText }] }],
            systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
            generationConfig: {
              responseMimeType: "application/json",
              temperature: 0.1
            }
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || `HTTP ${response.status}`);
        }

        const data = await response.json();
        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!rawText) throw new Error('ไม่พบข้อมูลตอบกลับจากโมเดล');

        const sanitizedText = rawText.replace(/^```json\s*/i, '').replace(/\s*```$/i, '').trim();
        const specData = JSON.parse(sanitizedText);

        currentSpec = specData;
        const actionLabel = `จัดท่าทาง: ${poseName}`;
        promptSession.push(actionLabel);
        modelHistory.push({
          spec: JSON.parse(JSON.stringify(specData)),
          session: [...promptSession]
        });

        renderModel(specData);
        setStatus('ready', `จัดท่าทาง "${poseName}" สำเร็จเรียบร้อย`);
        exportBtn.disabled = false;
      } catch (err) {
        setStatus('error', 'จัดท่าทางล้มเหลว: ' + err.message);
      } finally {
        generateBtn.disabled = false;
        resetBtn.disabled = false;
        updatePoseButtonsState();
        updateHistoryUI();
        updateUndoButtonState();
      }
    }

    poseStandBtn.addEventListener('click', () => {
      applySmartPose('ยืนตรง (Stand)', 'Return character limbs into a natural, balanced upright standing pose.');
    });

    poseRunBtn.addEventListener('click', () => {
      applySmartPose('ท่าวิ่ง (Run)', 'Adjust arms and legs into a dynamic athletic running pose with arms swinging opposite to legs, knees bent, torso leaning forward.');
    });

    poseSitBtn.addEventListener('click', () => {
      applySmartPose('ท่านั่ง (Sit)', 'Bend hip joints and thighs forward 90 degrees and knees down 90 degrees, lowering the character root so it looks seated.');
    });

    poseWaveBtn.addEventListener('click', () => {
      applySmartPose('โบกมือทักทาย (Wave)', 'Raise one arm upward with elbow bent, palm facing forward waving to the viewer, head tilted friendly.');
    });

    undoBtn.addEventListener('click', () => {
      if (modelHistory.length > 1) {
        modelHistory.pop();
        const prevState = modelHistory[modelHistory.length - 1];
        currentSpec = JSON.parse(JSON.stringify(prevState.spec));
        promptSession = [...prevState.session];
        
        renderModel(currentSpec);
        downloadLink.style.display = 'none';
        setStatus('ready', `ย้อนกลับไปยังทรงก่อนหน้าเรียบร้อย (ขั้นตอนที่ ${promptSession.length})`);
        exportBtn.disabled = false;
        
        updatePoseButtonsState();
        updateHistoryUI();
        updateUndoButtonState();
      }
    });

    resetBtn.addEventListener('click', () => {
      currentSpec = null;
      promptSession = [];
      modelHistory.length = 0;

      deselectPart();
      promptInput.value = '';
      
      imageInputFront.value = '';
      frontImageBase64 = null;
      frontImageMimeType = null;
      uploadedPreviewContainerFront.style.display = 'none';
      uploadedImagePreviewFront.src = '';

      imageInputSide.value = '';
      sideImageBase64 = null;
      sideImageMimeType = null;
      uploadedPreviewContainerSide.style.display = 'none';
      uploadedImagePreviewSide.src = '';

      previewContainer.style.display = 'none';
      downloadLink.style.display = 'none';
      exportBtn.disabled = true;

      while (modelGroup.children.length > 0) {
        const obj = modelGroup.children[0];
        disposeObject(obj);
        modelGroup.remove(obj);
      }
      renderer.render(scene, camera);

      updatePoseButtonsState();
      updateHistoryUI();
      updateUndoButtonState();
      setStatus('idle', 'ล้างข้อมูลโมเดลและคำสั่งเรียบร้อย เริ่มต้นใหม่ได้ทันที');
    });

    exportBtn.addEventListener('click', () => {
      deselectPart();
      setStatus('generating', 'กำลังสร้างไฟล์ GLB...');
      const exporter = new GLTFExporter();
      exporter.parse(
        modelGroup,
        (glb) => {
          const blob = new Blob([glb], { type: 'model/gltf-binary' });
          const url = URL.createObjectURL(blob);
          downloadLink.href = url;
          downloadLink.style.display = 'block';
          setStatus('ready', 'Export สำเร็จ! กดดาวน์โหลดไฟล์ด้านล่าง');
        },
        (error) => {
          setStatus('error', 'Export error: ' + error.message);
        },
        { binary: true }
      );
    });

    setTimeout(updateViewport, 100);
  </script>
</body>
